<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance</title>
    <style>
        /* Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Light Grey Background */
            background-color: #f3f4f6; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Main Container */
        .maintenance-card {
            /* White Card */
            background-color: #ffffff;
            padding: 3rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 600px;
            width: 90%;
            border-top: 6px solid #1e3a8a; /* Navy Blue Accent Top */
        }

        /* Typography */
        h1 {
            /* Navy Blue */
            color: #1e3a8a;
            font-size: 2rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        p {
            /* Medium Grey Text */
            color: #4b5563;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .footer {
            font-size: 0.875rem;
            color: #9ca3af;
            border-top: 1px solid #e5e7eb;
            padding-top: 1.5rem;
        }

        /* Optional: Contact Link Styling */
        a {
            color: #1e3a8a;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="maintenance-card">
        <h1>Under Construction</h1>
        <p>
            We are currently making improvements to our website. 
            We apologize for the inconvenience and will be back online shortly.
        </p>
        
        <div class="footer">
            &copy; 2025 Intrepid Flights. Need to reach us? <a href="mailto:info@example.com">Email Us</a>
        </div>
    </div>

</body>
</html>
