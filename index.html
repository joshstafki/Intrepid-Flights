<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intrepid Flights | Drone Photography</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/joshstafki/Intrepid-Flights/main/favicon.jpg">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* SIDEBAR STYLES */
        .sidebar {
            width: 350px;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 50px 45px;
            border-right: 1px solid #2a2a2a;
            z-index: 10;
        }

        .header-section h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .header-section .title {
            font-size: 1rem;
            font-style: italic;
            color: #999;
            margin-bottom: 25px;
            display: block;
        }

        .location-text {
            font-size: 0.85rem;
            line-height: 1.6;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 40px;
        }

        /* SERVICES SECTION */
        .services-menu {
            margin: 40px 0;
        }

        .services-menu h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #444;
            margin-bottom: 20px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 8px;
        }

        .service-list {
            list-style: none;
        }

        .service-item {
            display: flex;
            align-items: center;
            margin-bottom: 18px;
            font-size: 0.95rem;
            font-weight: 300;
            color: #ddd;
        }

        .service-item i {
            font-size: 0.8rem;
            margin-right: 15px;
            color: #666;
            transform: rotate(-45deg);
        }

        /* FOOTER SECTION */
        .contact-box {
            margin-top: auto;
        }

        .contact-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #444;
            margin-bottom: 15px;
            display: block;
        }

        .contact-details p {
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .contact-details a {
            color: #bbb;
            text-decoration: none;
            transition: color 0.3s;
        }

        .contact-details a:hover {
            color: #fff;
        }

        .social-links {
            display: flex;
            gap: 18px;
            margin-top: 25px;
        }

        .social-links a {
            color: #444;
            transition: color 0.3s;
        }

        .social-links a:hover {
            color: #fff;
        }

        /* MAIN HERO VIEW */
        .hero-view {
            flex-grow: 1;
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.5)), 
                        url('https://raw.githubusercontent.com/joshstafki/Intrepid-Flights/main/cancun.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: flex-end; /* Aligns content to the bottom */
            padding-left: 40px;    /* Tighter to the left edge */
            padding-bottom: 40px;  /* Tighter to the bottom edge */
        }

        /* PRECISION TEXT EFFECT */
        .precision-overlay h2 {
            font-size: 4.5rem;
            font-weight: 700;
            line-height: 0.9;
            letter-spacing: -2px;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1.2s forwards ease-out;
            animation-delay: 0.5s;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* SUBTLE IMAGE ATTRIBUTION */
        .image-location {
            position: absolute;
            bottom: 20px;
            right: 30px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.4);
            font-weight: 300;
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .container { flex-direction: column; overflow-y: auto; }
            .sidebar { width: 100%; height: auto; padding: 40px 30px; }
            .hero-view { height: 500px; flex-grow: 0; padding-left: 30px; padding-bottom: 30px; }
            .precision-overlay h2 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <aside class="sidebar">
            <div class="header-section">
                <h1>Intrepid Flights</h1>
                <span class="title">by Joshua Stafki</span>
                
                <div class="location-text">
                    Serving The Twin Cities<br>
                    & Surrounding Communities
                </div>

                <div class="services-menu">
                    <h3>Services</h3>
                    <ul class="service-list">
                        <li class="service-item"><i class="fas fa-plane"></i> Aerial Photography</li>
                        <li class="service-item"><i class="fas fa-plane"></i> Real Estate</li>
                        <li class="service-item"><i class="fas fa-plane"></i> Geographical Mapping</li>
                    </ul>
                </div>
            </div>

            <div class="contact-box">
                <span class="contact-label">Contact Info</span>
                <div class="contact-details">
                    <p><a href="tel:7639101792">763-910-1792</a></p>
                    <p><a href="mailto:joshstafki@intrepidflights.com">joshstafki@intrepidflights.com</a></p>
                </div>

                <div class="social-links">
                    <a href="#"><i class="fab fa-facebook-f"></i></a>
                    <a href="https://www.linkedin.com/company/intrepid-flights-drone-photography"><i class="fab fa-linkedin-in"></i></a>
                    <a href="https://www.instagram.com/intrepid.flights?igsh=ZW11Zzd1OW13NnR3&utm_source=qr"><i class="fab fa-instagram"></i></a>
                </div>
            </div>
        </aside>

        <main class="hero-view">
            <div class="precision-overlay">
                <h2>FLIGHTS<br>DESIGNED WITH<br>PRECISION.</h2>
            </div>

            <div class="image-location">
                Aerial View of Cancun, Mexico
            </div>
        </main>
    </div>

</body>
</html>
