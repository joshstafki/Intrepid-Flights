<html lang="en">
<head>

    <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/joshstafki/Intrepid-Flights/main/favicon.jpg">

    <script type="text/javascript">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            color: #ffffff;
            /* Desktop prevents scroll, Mobile allows it */
            overflow: hidden; 
        }

        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
            flex-direction: row;
        }

        /* SIDEBAR / HEADER STYLES */
        .sidebar {
            width: 350px;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 50px 45px;
            border-right: 1px solid #2a2a2a;
            z-index: 10;
            flex-shrink: 0;
        }

        .header-section h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .header-section .title {
            font-size: 1rem;
            font-style: italic;
            color: #999;
            margin-bottom: 25px;
            display: block;
        }

        .location-text {
            font-size: 0.85rem;
            line-height: 1.6;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 40px;
        }

        .services-menu h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #444;
            margin-bottom: 20px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 8px;
        }

        .service-list { list-style: none; }

        .service-item {
            display: flex;
            align-items: center;
            margin-bottom: 18px;
            font-size: 0.95rem;
            font-weight: 300;
            color: #ddd;
        }

        .service-item i {
            font-size: 0.8rem;
            margin-right: 15px;
            color: #666;
            transform: rotate(-45deg);
        }

        /* CONTACT & SOCIAL */
        .contact-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #444;
            margin-bottom: 15px;
            display: block;
        }

        .contact-details p { font-size: 0.9rem; margin-bottom: 8px; }
        .contact-details a { color: #bbb; text-decoration: none; transition: 0.3s; }
        .contact-details a:hover { color: #fff; }

        .social-links { display: flex; gap: 18px; margin-top: 25px; }
        .social-links a { color: #444; transition: 0.3s; }
        .social-links a:hover { color: #fff; }

        /* HERO VIEW */
        .hero-view {
            flex-grow: 1;
            background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), 
                        url('https://raw.githubusercontent.com/joshstafki/Intrepid-Flights/main/cancun.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: flex-end; 
            padding-left: 40px;
            padding-bottom: 40px;
        }

        .precision-overlay h2 {
            font-size: 4.5rem;
            font-weight: 700;
            line-height: 0.9;
            letter-spacing: -2px;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1.2s forwards ease-out;
            animation-delay: 0.5s;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .image-location {
            position: absolute;
            bottom: 20px;
            right: 30px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.4);
            font-weight: 300;
        }

        /* --- MOBILE RESPONSIVE QUERIES --- */
        @media (max-width: 900px) {
            body {
                overflow-y: auto; /* Allow scrolling on mobile */
            }

            .container {
                flex-direction: column; /* Stack sidebar on top of image */
                height: auto;
            }

            .sidebar {
                width: 100%;
                padding: 40px 30px;
                border-right: none;
                border-bottom: 1px solid #2a2a2a;
            }

            .hero-view {
                height: 70vh; /* Set a specific height for the image on mobile */
                padding-left: 20px;
                padding-bottom: 30px;
            }

            .precision-overlay h2 {
                font-size: 2.2rem; /* Much smaller for mobile screens */
                letter-spacing: -1px;
            }

            .image-location {
                font-size: 0.6rem;
                bottom: 15px;
                right: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

            <div class="contact-box">
                <span class="contact-label">Contact Info</span>
                <div class="contact-details">
                    <p><a href="tel:7639101792">763-910-1792</a></p>
                    <p><a href="mailto:joshstafki@intrepidflights.com">joshstafki@intrepidflights.com</a></p>
                </div>

                <div class="social-links">
                    <a href="#"><i class="fab fa-x"></i></a>
                    <a href="https://www.linkedin.com/company/intrepid-flights-drone-photography" target="_blank"><i class="fab fa-linkedin-in"></i></a>
                    <a href="https://www.instagram.com/intrepid.flights?igsh=ZW11Zzd1OW13NnR3&utm_source=qr" target="_blank"><i class="fab fa-instagram"></i></a>
                </div>
            </div>
        </aside>

        <main class="hero-view">
            <div class="precision-overlay">
                <h2>FLIGHTS<br>DESIGNED<br>WITH PRECISION.</h2>
            </div>

            <div class="image-location">
                Aerial View of Cancun, Mexico
            </div>
        </main>
    </div>

</body>
</html>
