<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intrepid Flights | Promo Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --brand-white: #FFFFFF;
            --brand-grey: #A7A8AA;
            --brand-navy: #002F6C;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Inter', sans-serif;
            background-color: var(--brand-white);
            color: var(--brand-navy);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #promo-container {
            text-align: center;
            width: 100%;
            transition: opacity 0.5s ease;
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(2rem, 8vw, 3rem);
            letter-spacing: 3px;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        .input-box {
            background: var(--brand-white);
            border: 2px solid var(--brand-grey);
            padding: 15px;
            font-size: 1.2rem;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 2px;
            width: 80%;
            max-width: 350px;
            text-align: center;
            outline: none;
            border-radius: 0;
        }

        .input-box:focus {
            border-color: var(--brand-navy);
        }

        .verify-btn {
            display: block;
            margin: 30px auto;
            background: var(--brand-navy);
            color: white;
            border: none;
            padding: 15px 60px;
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Screenshot Mode Styling */
        #screenshot-zone {
            display: none;
            opacity: 0;
            width: 100%;
            height: 100vh;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--brand-white);
        }

        .promo-graphic {
            max-width: 90%;
            max-height: 70vh; /* Reduced slightly to make room for footer text */
            box-shadow: 0 10px 50px rgba(0,0,0,0.1);
            border: 1px solid #eee;
            margin-bottom: 20px;
        }

        .footer-navigation {
            text-align: center;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .screenshot-hint {
            font-size: 0.8rem;
            color: var(--brand-grey);
            margin-bottom: 10px;
        }

        .home-link {
            font-size: 1rem;
            color: var(--brand-navy);
            text-decoration: none;
            border-bottom: 1px solid var(--brand-navy);
            padding-bottom: 2px;
            transition: opacity 0.3s;
        }

        .home-link:hover {
            opacity: 0.7;
        }

        .error {
            color: #d93025;
            font-size: 0.8rem;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div id="promo-container">
        <h1>Intrepid Flights</h1>
        <input type="text" id="promo-input" class="input-box" placeholder="PROMO CODE" autocomplete="off">
        <p id="error-text" class="error">INVALID CODE</p>
        <button class="verify-btn" onclick="activatePromo()">Validate</button>
    </div>

    <div id="screenshot-zone">
        <img src="https://via.placeholder.com/600x800.png?text=FIRST+FLIGHT+PROMO" class="promo-graphic" alt="Intrepid Flights Promo">
        
        <div class="footer-navigation">
            <div class="screenshot-hint">Screenshot this code for your records</div>
            <a href="https://www.intrepidflights.com" class="home-link">Return to Intrepid Flights</a>
        </div>
    </div>

    <script>
        function activatePromo() {
            const val = document.getElementById('promo-input').value.trim().toUpperCase();
            const container = document.getElementById('promo-container');
            const screenshotZone = document.getElementById('screenshot-zone');
            const error = document.getElementById('error-text');

            if (val === 'FIRSTFLIGHT') {
                // Firework Explosion using Brand Colors
                const count = 200;
                const defaults = { origin: { y: 0.7 }, colors: ['#002F6C', '#A7A8AA', '#FFFFFF'] };

                function fire(particleRatio, opts) {
                    confetti(Object.assign({}, defaults, opts, {
                        particleCount: Math.floor(count * particleRatio)
                    }));
                }

                fire(0.25, { spread: 26, startVelocity: 55 });
                fire(0.2, { spread: 60 });
                fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
                fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
                fire(0.1, { spread: 120, startVelocity: 45 });

                // Transition to Screenshot Mode
                container.style.opacity = '0';
                
                setTimeout(() => {
                    container.style.display = 'none';
                    screenshotZone.style.display = 'flex';
                    setTimeout(() => {
                        screenshotZone.style.opacity = '1';
                    }, 50);
                }, 500);

            } else {
                error.style.display = 'block';
                document.getElementById('promo-input').style.borderColor = '#d93025';
            }
        }

        document.getElementById('promo-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') activatePromo();
        });
    </script>
</body>
</html>
