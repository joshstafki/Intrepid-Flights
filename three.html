<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Intrepid Flights | Mobile</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #121212;
            --text-white: #ffffff;
            --text-mute: #b0b0b0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark); /* Fallback color */
            color: var(--text-white);
            overflow-x: hidden;
        }

        /* --- 1. FIXED HERO LAYER (The Background) --- */
        .fixed-hero {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 0; /* Sits behind everything */
            
            /* Image Settings */
            background: url('https://raw.githubusercontent.com/joshstafki/Intrepid-Flights/main/image.jpeg') no-repeat center center;
            background-size: cover;
            
            /* Flexbox to put text in Bottom Left */
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Push to bottom */
            align-items: flex-start;   /* Push to left */
            padding: 0 0 120px 24px;   /* Padding: Top Right Bottom Left. 120px bottom clears the scroll arrow */
        }

        /* Dark overlay for readability */
        .fixed-hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%);
            z-index: -1;
        }

        .hero-text h2 {
            font-family: 'Oswald', sans-serif;
            font-size: 3.5rem;
            line-height: 0.9;
            text-transform: uppercase;
            font-weight: 700;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
            margin: 0;
        }

        /* Coordinates (Top Right) */
        .coordinates {
            position: absolute;
            top: 30px;
            right: 24px;
            font-family: monospace;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.8);
            text-align: right;
            letter-spacing: 1px;
        }

        /* Bouncing Arrow */
        .scroll-prompt {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
            opacity: 0.8;
            cursor: pointer;
        }

        /* --- 2. SCROLLING CONTENT LAYER (The Curtain) --- */
        .content-layer {
            position: relative;
            z-index: 10; /* Sits ON TOP of the hero */
            margin-top: 100vh; /* Pushes content below the fold initially */
            background-color: var(--bg-dark);
            
            /* Visual styling for the panel */
            border-top: 1px solid #333;
            box-shadow: 0 -20px 50px rgba(0,0,0,0.8);
            padding: 60px 30px 100px 30px;
            min-height: 100vh; /* Ensure it covers the screen when scrolling up */
        }

        /* --- CONTENT STYLING --- */
        .brand-header { margin-bottom: 50px; }
        .brand-header h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .brand-header .subtitle {
            font-size: 0.9rem;
            color: var(--text-mute);
            display: block; margin-bottom: 20px; font-weight: 300;
        }
        .location-tag {
            border-left: 2px solid #fff; padding-left: 15px;
            font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.5px;
            line-height: 1.6; color: #ccc;
        }

        .section-label {
            font-family: 'Oswald', sans-serif; font-size: 0.8rem;
            text-transform: uppercase; letter-spacing: 2px; color: #555;
            margin-bottom: 25px; display: block;
            border-bottom: 1px solid #333; padding-bottom: 10px;
        }

        .service-list { list-style: none; margin-bottom: 60px; }
        .service-item {
            font-family: 'Oswald', sans-serif; font-size: 2rem;
            color: #777; margin-bottom: 20px; cursor: pointer;
            transition: 0.2s; background: none; border: none;
            text-align: left; width: 100%; text-transform: uppercase;
        }
        .service-item.active {
            color: #fff; padding-left: 15px; border-left: 4px solid #fff;
        }

        .contact-link {
            display: block; font-size: 1.2rem; color: #fff;
            text-decoration: none; margin-bottom: 15px; font-weight: 300;
            border-bottom: 1px dotted #333; width: fit-content;
        }
        .social-row { display: flex; gap: 25px; margin-top: 40px; }
        .social-row a { color: #fff; font-size: 1.5rem; opacity: 0.7; }
        .footer-copy { margin-top: 60px; font-size: 0.7rem; color: #444; text-transform: uppercase; text-align: center; }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateX(-50%) translateY(0);}
            40% {transform: translateX(-50%) translateY(-10px);}
            60% {transform: translateX(-50%) translateY(-5px);}
        }
    </style>
</head>
<body>

    <div class="fixed-hero">
        <div class="coordinates">
            LAT 44.9778° N<br>LON 93.2650° W
        </div>

        <div class="hero-text">
            <h2>Flights<br>Designed<br>With Precision.</h2>
        </div>

        <div class="scroll-prompt" onclick="slideUp()">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 13l5 5 5-5M7 6l5 5 5-5"/>
            </svg>
        </div>
    </div>

    <div class="content-layer" id="menu-panel">
        
        <div class="brand-header">
            <h1>Intrepid Flights</h1>
            <span class="subtitle">by Joshua Stafki</span>
            <div class="location-tag">
                Serving The Twin Cities<br>
                & Surrounding Communities
            </div>
        </div>

        <span class="section-label">Services</span>
        <div class="service-list">
            <button class="service-item" onclick="select(this)">Aerial Photography</button>
            <button class="service-item" onclick="select(this)">Geo Mapping</button>
            <button class="service-item" onclick="select(this)">Real Estate</button>
            <button class="service-item" onclick="select(this)">Cinematography</button>
            <button class="service-item" onclick="select(this)">Inspections</button>
        </div>

        <span class="section-label">Connect</span>
        <div>
            <a href="tel:7639101792" class="contact-link">763-910-1792</a>
            <a href="mailto:joshstafki@intrepidflights.com" class="contact-link">joshstafki@intrepidflights.com</a>
        </div>

        <div class="social-row">
            <a href="https://x.com/intrepidflights?s=21"><i class="fab fa-x-twitter"></i></a>
            <a href="https://www.linkedin.com/company/intrepid-flights-drone-photography"><i class="fab fa-linkedin-in"></i></a>
            <a href="https://www.instagram.com/intrepid.flights?igsh=ZW11Zzd1OW13NnR3&utm_source=qr"><i class="fab fa-instagram"></i></a>
            <a href="https://www.youtube.com/@intrepid.flights"><i class="fab fa-youtube"></i></a>
        </div>

        <div class="footer-copy">&copy; 2025 Intrepid Flights</div>
    </div>

    <script>
        function slideUp() {
            if (navigator.vibrate) navigator.vibrate(10);
            document.getElementById('menu-panel').scrollIntoView({ behavior: 'smooth' });
        }

        function select(el) {
            if (navigator.vibrate) navigator.vibrate(5);
            document.querySelectorAll('.service-item').forEach(i => {
                i.classList.remove('active');
                i.style.color = '#777';
                i.style.borderLeft = 'none';
                i.style.paddingLeft = '0';
            });
            el.classList.add('active');
            el.style.color = '#fff';
            el.style.borderLeft = '4px solid #fff';
            el.style.paddingLeft = '15px';
        }
    </script>

</body>
</html>
