<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="https://intrepidflights.com/assets/indigo.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://intrepidflights.com/assets/apple-touch-icon.png">
<title>Intrepid Flights — Live Stream Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #002F6C;
    --navy-deep: #001a3d;
    --silver: #A7A8AA;
    --white: #FFFFFF;
    --gold: #C9A84C;
    --gold-light: #F0C96A;
    --gold-dim: #7a6430;
    --black: #0a0b0d;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Atmospheric background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  /* Subtle grid texture */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(167,168,170,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(167,168,170,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    width: 100%;
    max-width: 860px;
    padding: clamp(1rem, 5vw, 2rem);
    text-align: center;
  }

  /* Top accent bar */
  .accent-bar {
    width: 3px;
    height: 64px;
    background: linear-gradient(to bottom, transparent, var(--gold), transparent);
    margin-bottom: 2.5rem;
    opacity: 0;
    animation: fadeSlideDown 0.8s ease forwards 0.2s;
  }

  /* Eyebrow label */
  .eyebrow {
    font-family: 'Inter', sans-serif;
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1.1rem;
    opacity: 0;
    animation: fadeSlideDown 0.8s ease forwards 0.4s;
  }

  /* Headline */
  .headline {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(1.75rem, 5.5vw, 3.8rem);
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    line-height: 1.1;
    color: var(--white);
    margin-bottom: 0.5rem;
    opacity: 0;
    animation: fadeSlideDown 0.8s ease forwards 0.6s;
  }

  .headline em {
    font-style: normal;
    color: var(--gold-light);
  }

  .subheadline {
    font-family: 'Inter', sans-serif;
    font-size: clamp(0.8rem, 1.6vw, 1rem);
    font-weight: 300;
    color: var(--silver);
    letter-spacing: 0.05em;
    margin-bottom: 3.5rem;
    opacity: 0;
    animation: fadeSlideDown 0.8s ease forwards 0.8s;
  }

  /* Divider */
  .divider {
    width: 100%;
    max-width: 520px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold-dim), transparent);
    margin-bottom: 2.8rem;
    opacity: 0;
    animation: fadeIn 1s ease forwards 1s;
  }

  /* Countdown label */
  .countdown-label {
    font-family: 'Oswald', sans-serif;
    font-size: 0.8rem;
    font-weight: 400;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--silver);
    margin-bottom: 1.5rem;
    opacity: 0;
    animation: fadeSlideDown 0.8s ease forwards 1.1s;
  }

  /* Timer grid */
  .timer {
    display: flex;
    gap: clamp(0.5rem, 3vw, 2.5rem);
    align-items: flex-start;
    margin-bottom: 1rem;
    opacity: 0;
    animation: fadeSlideDown 0.8s ease forwards 1.3s;
  }

  .time-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    min-width: clamp(48px, 12vw, 110px);
  }

  .time-digits {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(2.4rem, 9vw, 7rem);
    font-weight: 700;
    line-height: 1;
    color: var(--white);
    position: relative;
    text-shadow: 0 0 40px rgba(201,168,76,0.15);
    letter-spacing: -0.02em;
    transition: color 0.15s;
  }

  .time-digits.flash {
    color: var(--gold-light);
    text-shadow: 0 0 30px rgba(240,201,106,0.6);
  }

  .time-unit {
    font-family: 'Inter', sans-serif;
    font-size: 0.6rem;
    font-weight: 500;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold-dim);
  }

  .time-separator {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(2.2rem, 8vw, 6.5rem);
    font-weight: 300;
    color: var(--gold-dim);
    line-height: 1;
    margin-top: 0.1rem;
    animation: blink 1s step-end infinite;
    opacity: 0.7;
  }

  @keyframes blink {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 0.15; }
  }

  /* Target time note */
  .target-note {
    font-family: 'Inter', sans-serif;
    font-size: 0.72rem;
    color: var(--silver);
    opacity: 0.55;
    margin-bottom: 3.5rem;
    letter-spacing: 0.05em;
    opacity: 0;
    animation: fadeIn 1s ease forwards 1.6s;
  }

  /* CTA Button */
  .cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.7rem;
    font-family: 'Oswald', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--black);
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    border: none;
    padding: 1rem 2.4rem;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
    opacity: 0;
    animation: fadeSlideUp 0.8s ease forwards 1.8s;
    clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
  }

  .cta-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.25), transparent);
    opacity: 0;
    transition: opacity 0.25s;
  }

  .cta-btn:hover::before { opacity: 1; }
  .cta-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(201,168,76,0.4); }
  .cta-btn:active { transform: translateY(0); }

  .cta-arrow {
    font-size: 1.1rem;
    transition: transform 0.2s;
  }
  .cta-btn:hover .cta-arrow { transform: translateX(3px); }

  /* Bottom branding mark */
  .brand-mark {
    position: fixed;
    bottom: clamp(1rem, 4vw, 1.8rem);
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Oswald', sans-serif;
    font-size: clamp(0.5rem, 2vw, 0.6rem);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(167,168,170,0.25);
    white-space: nowrap;
    z-index: 10;
  }

  /* Gold accent lines - decorative corners */
  .corner {
    position: fixed;
    width: clamp(20px, 4vw, 32px);
    height: clamp(20px, 4vw, 32px);
    z-index: 5;
    opacity: 0.35;
  }
  .corner-tl { top: clamp(0.75rem, 4vw, 1.5rem); left: clamp(0.75rem, 4vw, 1.5rem); border-top: 1px solid var(--gold); border-left: 1px solid var(--gold); }
  .corner-tr { top: clamp(0.75rem, 4vw, 1.5rem); right: clamp(0.75rem, 4vw, 1.5rem); border-top: 1px solid var(--gold); border-right: 1px solid var(--gold); }
  .corner-bl { bottom: clamp(0.75rem, 4vw, 1.5rem); left: clamp(0.75rem, 4vw, 1.5rem); border-bottom: 1px solid var(--gold); border-left: 1px solid var(--gold); }
  .corner-br { bottom: clamp(0.75rem, 4vw, 1.5rem); right: clamp(0.75rem, 4vw, 1.5rem); border-bottom: 1px solid var(--gold); border-right: 1px solid var(--gold); }

  /* Animations */
  @keyframes fadeSlideDown {
    from { opacity: 0; transform: translateY(-18px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Confetti canvas */
  #confetti-canvas {
    position: fixed;
    inset: 0;
    z-index: 100;
    pointer-events: none;
    display: none;
  }

  /* Launch overlay */
  #launch-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: var(--black);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.2rem;
  }

  #launch-overlay.active { display: flex; }

  .launch-text {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold-light);
    text-shadow: 0 0 60px rgba(240,201,106,0.5);
    animation: pulse 1s ease-in-out infinite alternate;
  }

  .launch-sub {
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    color: var(--silver);
  }

  #redirect-bar-wrap {
    width: 280px;
    height: 2px;
    background: rgba(255,255,255,0.1);
    margin-top: 0.5rem;
    overflow: hidden;
  }

  #redirect-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(to right, var(--gold-dim), var(--gold-light));
    transition: width 5s linear;
  }

  @keyframes pulse {
    from { opacity: 0.7; }
    to { opacity: 1; }
  }
</style>
</head>
<body>

<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>

<canvas id="confetti-canvas"></canvas>

<div id="launch-overlay">
  <div class="launch-text">We're Live.</div>
  <div class="launch-sub">Redirecting to YouTube&hellip;</div>
  <div id="redirect-bar-wrap"><div id="redirect-bar"></div></div>
</div>

<div class="container" id="main-container">
  <div class="accent-bar"></div>
  <div class="eyebrow">Live Aviation · YouTube</div>
  <h1 class="headline">Intrepid Flights Streams<br><em>All Flights</em> on YouTube.</h1>
  <p class="subheadline">Watch every takeoff, approach, and landing — live and uncut.</p>
  <div class="divider"></div>
  <div class="countdown-label">Time Until Next Shoot</div>
  <div class="timer">
    <div class="time-block">
      <div class="time-digits" id="hours">00</div>
      <div class="time-unit">Hours</div>
    </div>
    <div class="time-separator">:</div>
    <div class="time-block">
      <div class="time-digits" id="minutes">00</div>
      <div class="time-unit">Minutes</div>
    </div>
    <div class="time-separator">:</div>
    <div class="time-block">
      <div class="time-digits" id="seconds">00</div>
      <div class="time-unit">Seconds</div>
    </div>
  </div>
  <p class="target-note" style="opacity:0.45; animation: fadeIn 1s ease forwards 1.6s;"></p>
  <a href="https://www.youtube.com/@Intrepid.Flights" target="_blank" class="cta-btn" id="yt-btn">
    Continue to YouTube <span class="cta-arrow">→</span>
  </a>
</div>

<div class="brand-mark">Intrepid Flights &mdash; Aviation Livestreams</div>

<script>
  // === TARGET TIME: 1:37 PM daily, locked to America/Chicago (CST/CDT) ===
  // Strategy: probe a UTC timestamp, read back what CT clock says, then shift to hit exactly 13:37 CT.
  function buildCTTarget(y, mo, d) {
    // Start with a UTC guess at noon that day
    const guess = Date.UTC(y, mo - 1, d, 18, 0, 0); // 18:00 UTC ~ noon-ish CT
    const probe = new Date(guess);

    // Read the CT hour/minute at that guess
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/Chicago',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    }).formatToParts(probe).reduce((a, p) => { a[p.type] = parseInt(p.value); return a; }, {});

    // Calculate how many ms to add/subtract so CT reads 13:37:00
    const ctTotalSec = parts.hour * 3600 + parts.minute * 60 + parts.second;
    const targetSec  = 13 * 3600 + 37 * 60;
    const diffMs = (targetSec - ctTotalSec) * 1000;

    return new Date(guess + diffMs);
  }

  function getNextTarget() {
    const now = new Date();
    const ctParts = new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/Chicago',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      hour12: false
    }).formatToParts(now).reduce((acc, p) => { acc[p.type] = p.value; return acc; }, {});

    const ctHour = parseInt(ctParts.hour);
    const ctMin  = parseInt(ctParts.minute);
    const todayPast = ctHour > 13 || (ctHour === 13 && ctMin >= 37);

    let y  = parseInt(ctParts.year);
    let mo = parseInt(ctParts.month);
    let d  = parseInt(ctParts.day);

    if (todayPast) {
      const tomorrow = new Date(now.getTime() + 24 * 60 * 60 * 1000);
      const tp = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/Chicago',
        year: 'numeric', month: '2-digit', day: '2-digit'
      }).formatToParts(tomorrow).reduce((acc, p) => { acc[p.type] = p.value; return acc; }, {});
      y  = parseInt(tp.year);
      mo = parseInt(tp.month);
      d  = parseInt(tp.day);
    }

    return buildCTTarget(y, mo, d);
  }

  let target = getNextTarget();
  let launched = false;
  let confettiActive = false;
  let confettiParticles = [];
  let confettiRAF = null;

  const hoursEl = document.getElementById('hours');
  const minutesEl = document.getElementById('minutes');
  const secondsEl = document.getElementById('seconds');
  const launchOverlay = document.getElementById('launch-overlay');
  const redirectBar = document.getElementById('redirect-bar');
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');

  function pad(n) { return String(Math.floor(n)).padStart(2, '0'); }

  function flashDigit(el) {
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 150);
  }

  let prevSec = -1, prevMin = -1, prevHour = -1;

  function tick() {
    const now = new Date();
    const diff = target - now;

    if (diff <= 0 && !launched) {
      launched = true;
      triggerLaunch();
      return;
    }

    if (diff > 0) {
      const totalSec = Math.floor(diff / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;

      if (s !== prevSec) { flashDigit(secondsEl); prevSec = s; }
      if (m !== prevMin) { flashDigit(minutesEl); prevMin = m; }
      if (h !== prevHour) { flashDigit(hoursEl); prevHour = h; }

      hoursEl.textContent = pad(h);
      minutesEl.textContent = pad(m);
      secondsEl.textContent = pad(s);
    }
  }

  // === CONFETTI ===
  const CONFETTI_COLORS = [
    '#C9A84C', '#F0C96A', '#FFFFFF', '#0a0b0d',
    '#e8d6a0', '#7a6430', '#fffff0', '#222222',
    '#d4af37', '#f5f5f5'
  ];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function spawnConfetti(n) {
    for (let i = 0; i < n; i++) {
      confettiParticles.push({
        x: Math.random() * canvas.width,
        y: -10 - Math.random() * 100,
        w: 8 + Math.random() * 10,
        h: 4 + Math.random() * 5,
        color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
        vx: (Math.random() - 0.5) * 3,
        vy: 2 + Math.random() * 4,
        rot: Math.random() * Math.PI * 2,
        rotV: (Math.random() - 0.5) * 0.15,
        opacity: 0.85 + Math.random() * 0.15,
        shape: Math.random() > 0.5 ? 'rect' : 'circle'
      });
    }
  }

  function drawConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = confettiParticles.length - 1; i >= 0; i--) {
      const p = confettiParticles[i];
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = p.opacity;
      ctx.fillStyle = p.color;
      if (p.shape === 'rect') {
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      } else {
        ctx.beginPath();
        ctx.ellipse(0, 0, p.w / 2, p.h / 2, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.rotV;
      p.vy += 0.05; // gravity
      p.opacity -= 0.003;

      if (p.y > canvas.height + 20 || p.opacity <= 0) {
        confettiParticles.splice(i, 1);
      }
    }

    if (confettiActive) {
      spawnConfetti(6);
    }

    if (confettiParticles.length > 0 || confettiActive) {
      confettiRAF = requestAnimationFrame(drawConfetti);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      canvas.style.display = 'none';
    }
  }

  function startConfetti() {
    resizeCanvas();
    canvas.style.display = 'block';
    confettiActive = true;
    confettiParticles = [];
    spawnConfetti(120);
    drawConfetti();
    setTimeout(() => { confettiActive = false; }, 3500);
  }

  // === LAUNCH SEQUENCE ===
  function triggerLaunch() {
    startConfetti();
    launchOverlay.classList.add('active');

    // Animate redirect bar
    setTimeout(() => {
      redirectBar.style.width = '100%';
    }, 100);

    // Redirect after 5s
    setTimeout(() => {
      window.open('https://www.youtube.com/@Intrepid.Flights', '_blank');
      resetAfterLaunch();
    }, 5200);
  }

  function resetAfterLaunch() {
    launchOverlay.classList.remove('active');
    redirectBar.style.transition = 'none';
    redirectBar.style.width = '0%';
    setTimeout(() => { redirectBar.style.transition = 'width 5s linear'; }, 50);

    launched = false;
    target = getNextTarget();
    prevSec = -1; prevMin = -1; prevHour = -1;
  }

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
