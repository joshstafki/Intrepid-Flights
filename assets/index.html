<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Intrepid Flights</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Oswald:wght@600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff;
            color: #1a1a1a;
        }

        .container {
            text-align: center;
            max-width: 400px;
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        p {
            font-weight: 400;
            color: #555;
            margin-bottom: 20px;
        }

        #countdown {
            font-family: 'Oswald', sans-serif;
            font-size: 5rem;
            color: #000;
            line-height: 1;
            margin-bottom: 30px;
            transition: opacity 0.2s ease-in-out;
        }

        .fallback-link {
            font-size: 0.9rem;
            color: #888;
            text-decoration: none;
            border-bottom: 1px solid #ccc;
        }

        .fallback-link:hover {
            color: #000;
            border-bottom-color: #000;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Preparing for Takeoff</h1>
    <p>Rerouting to Intrepid Flights in</p>
    <div id="countdown">3</div>
    <a href="https://www.intrepidflights.com" class="fallback-link">Click here if you aren't redirected</a>
</div>

<script type="text/javascript">
    let seconds = 3;
    const countdownElement = document.getElementById('countdown');
    const targetUrl = "https://www.intrepidflights.com";

    const interval = setInterval(() => {
        seconds--;
        
        // Brief fade effect for the number change
        countdownElement.style.opacity = 0;
        
        setTimeout(() => {
            countdownElement.textContent = seconds;
            countdownElement.style.opacity = 1;

            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = targetUrl;
            }
        }, 200);
        
    }, 1000);
</script>

</body>
</html>
