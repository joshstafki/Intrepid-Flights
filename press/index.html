<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsroom | Intrepid Flights</title>
    <link rel="icon" type="image/png" href="https://intrepidflights.com/assets/indigo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://intrepidflights.com/assets/apple-touch-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://intrepidflights.com/" />
    <meta property="og:title" content="Intrepid Flights" />
    <meta property="og:description" content="Latest updates and operational news from Intrepid Flights." />
    <meta property="og:image" content="https://intrepidflights.com/assets/ognewscard.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@intrepidflights" />
    <meta name="twitter:title" content="Intrepid Flights" />
    <meta name="twitter:description" content="Latest updates and operational news from Intrepid Flights." />
    <meta name="twitter:image" content="https://intrepidflights.com/assets/ognewscard.png" />

    <style>
        :root {
            --navy: #002F6C;
            --light-grey: #F8F9FA;
            --medium-grey: #E5E7EB;
            --text-grey: #4B5563;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--light-grey);
            color: var(--navy);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 30px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-family: 'Oswald', sans-serif;
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            color: var(--navy);
        }

        .return-home {
            font-family: 'Oswald', sans-serif;
            font-size: 0.85rem;
            text-decoration: none;
            color: var(--text-grey);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid transparent;
            transition: border-color 0.3s;
        }

        .return-home:hover {
            border-color: var(--navy);
            color: var(--navy);
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .hero-container {
            max-width: 600px;
            text-align: center;
            width: 100%;
        }

        .pre-title {
            font-family: 'Oswald', sans-serif;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text-grey);
            margin-bottom: 10px;
            display: block;
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(3rem, 10vw, 4.5rem);
            margin: 0;
            text-transform: uppercase;
            line-height: 1;
        }

        .accent-line {
            width: 60px;
            height: 4px;
            background-color: var(--navy);
            margin: 30px auto;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text-grey);
            max-width: 450px;
            margin: 0 auto;
        }

        /* --- News Card Styles --- */
        .featured-card {
            display: block;
            text-decoration: none;
            background-color: var(--white);
            border: 1px solid var(--medium-grey);
            padding: 35px 30px;
            margin-top: 24px;
            text-align: left;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .featured-card:hover {
            transform: translateY(-5px);
            border-color: var(--navy);
            box-shadow: 0 10px 20px rgba(0, 47, 108, 0.08);
        }

        /* First card gets extra top margin to match the original spacing */
        #news-card-container .featured-card:first-child {
            margin-top: 50px;
        }

        .featured-tag {
            font-family: 'Oswald', sans-serif;
            font-size: 0.8rem;
            color: var(--navy);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: 15px;
            display: block;
        }

        .featured-title {
            font-family: 'Oswald', sans-serif;
            font-size: 1.8rem;
            color: var(--navy);
            margin: 0 0 15px 0;
            line-height: 1.3;
        }

        .featured-desc {
            font-size: 1rem;
            color: var(--text-grey);
            margin: 0;
            max-width: 100%;
            line-height: 1.7;
        }

        /* Loading / error states */
        .news-status {
            margin-top: 50px;
            font-style: italic;
            color: var(--text-grey);
            font-size: 1rem;
        }

        .news-loading {
            margin-top: 50px;
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .news-loading span {
            width: 8px;
            height: 8px;
            background-color: var(--navy);
            border-radius: 50%;
            opacity: 0.2;
            animation: pulse 1.2s ease-in-out infinite;
        }

        .news-loading span:nth-child(2) { animation-delay: 0.2s; }
        .news-loading span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50%       { opacity: 1;   transform: scale(1.3); }
        }

        footer {
            padding: 40px;
            text-align: center;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: var(--text-grey);
            text-transform: uppercase;
        }

        .brand-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .archive-link {
            font-family: 'Oswald', sans-serif;
            font-size: 0.75rem;
            color: var(--text-grey);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
            transition: color 0.3s ease;
        }

        .archive-link:hover {
            color: var(--navy);
        }
    </style>
</head>
<body>

<header>
    <div class="brand-container">
        <a href="/" class="brand">Intrepid Flights</a>
        <a href="https://intrepidflights.com/press/archives/" class="archive-link">Press Archive</a>
    </div>
    <a href="/" class="return-home">Return to Home</a>
</header>

<main>
    <div class="hero-container">
        <span class="pre-title">Official</span>
        <h1>Newsroom</h1>
        <div class="accent-line"></div>
        <p>
            This index serves as the central hub for all Intrepid Flights press releases and corporate announcements.
            <br><br>
            Please check back for future updates and media statements.
        </p>

        <div id="news-card-container">
            <div class="news-loading">
                <span></span><span></span><span></span>
            </div>
        </div>
    </div>
</main>

<footer>
    &copy; 2026 Intrepid Flights
</footer>

<script>
    // ─── CONFIG ────────────────────────────────────────────────────────────────
    // Published Google Sheet CSV export URL.
    const SHEET_CSV_URL =
        'https://docs.google.com/spreadsheets/d/e/2PACX-1vQVae_znI9joNrAzn9hkrnulmoVTIt3E7-B-hBb_prwzr2-BQaNZX3fveYKg16RC7pqyWu4CT3rQP-n/pub?output=csv';

    // ─── CSV PARSER ────────────────────────────────────────────────────────────
    function parseCSVRow(row) {
        const result = [];
        let current = '';
        let inQuotes = false;

        for (let i = 0; i < row.length; i++) {
            const ch = row[i];
            if (ch === '"') {
                if (inQuotes && row[i + 1] === '"') {
                    current += '"'; i++;
                } else {
                    inQuotes = !inQuotes;
                }
            } else if (ch === ',' && !inQuotes) {
                result.push(current); current = '';
            } else {
                current += ch;
            }
        }
        result.push(current);
        return result;
    }

    function parseCSV(text) {
        const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim().split('\n');
        if (lines.length < 2) return [];

        const headers = parseCSVRow(lines[0]).map(h => h.trim().toLowerCase());
        const rows = [];

        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const values = parseCSVRow(lines[i]);
            const row = {};
            headers.forEach((h, idx) => {
                row[h] = (values[idx] || '').trim();
            });
            rows.push(row);
        }
        return rows;
    }

    // ─── COLUMN RESOLVER ───────────────────────────────────────────────────────
    function col(row, ...aliases) {
        for (const alias of aliases) {
            if (row[alias] !== undefined && row[alias] !== '') return row[alias];
        }
        return '';
    }

    // ─── HTML ESCAPING ─────────────────────────────────────────────────────────
    function esc(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // ─── CARD RENDERER ─────────────────────────────────────────────────────────
    function renderCards(rows) {
        const container = document.getElementById('news-card-container');

        const valid = rows.filter(row =>
            col(row, 'title', 'headline', 'name', 'subject', 'release title') !== ''
        );

        if (valid.length === 0) {
            container.innerHTML =
                '<p class="news-status">No announcements at this time. Please check back later.</p>';
            return;
        }

        const html = valid.slice(0, 1).map((row, idx) => {
            const title = col(row, 'title', 'headline', 'name', 'subject', 'release title');
            
            // --- THE CHANGE IS HERE ---
            // 'snippet' has been added as the first priority column name
            const desc  = col(row, 'snippet', 'description', 'summary', 'excerpt', 'body', 'content', 'blurb');
            
            const url   = col(row, 'url', 'link', 'href', 'press release url', 'release url');
            const date  = col(row, 'date', 'published', 'pub date', 'publish date', 'release date');
            const tag   = col(row, 'tag', 'category', 'label', 'type', 'section')
                          || (idx === 0 ? 'Latest' : 'Announcement');

            const tagLine = `<span class="featured-tag">${esc(tag)}${date ? ' &mdash; ' + esc(date) : ''}</span>`;
            const titleEl = `<div class="featured-title">${esc(title)}</div>`;
            const descEl  = desc ? `<p class="featured-desc">${esc(desc)}</p>` : '';
            const inner   = tagLine + titleEl + descEl;

            if (url) {
                return `<a class="featured-card" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${inner}</a>`;
            }
            return `<div class="featured-card">${inner}</div>`;
        }).join('');

        container.innerHTML = html;
    }

    // ─── FETCH ─────────────────────────────────────────────────────────────────
    fetch(SHEET_CSV_URL)
        .then(res => {
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.text();
        })
        .then(csv => {
            const rows = parseCSV(csv);
            renderCards(rows);
        })
        .catch(err => {
            console.error('Newsroom: failed to load sheet data —', err);
            document.getElementById('news-card-container').innerHTML =
                '<p class="news-status">Latest news is currently unavailable. Please check back later.</p>';
        });
</script>
</body>
</html>
