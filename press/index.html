<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Press Releases | Intrepid Flights</title>
    <link rel="icon" type="image/png" href="https://intrepidflights.com/assets/indigo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://intrepidflights.com/assets/apple-touch-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-navy: #002F6C;
            --cool-grey: #A7A8AA;
            --pure-white: #FFFFFF;
            --text-dark: #1A1A1A;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--pure-white);
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
        }

        header {
            background-color: var(--primary-navy);
            color: var(--pure-white);
            padding: 60px 20px;
            text-align: center;
            border-bottom: 8px solid var(--cool-grey);
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 2.5rem;
            margin: 0;
        }

        .current-date {
            font-family: 'Oswald', sans-serif;
            color: var(--cool-grey);
            margin-top: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 20px;
        }

        /* Press Item Layout */
        .press-item {
            margin-bottom: 70px;
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .press-item h2 {
            font-family: 'Oswald', sans-serif;
            color: var(--primary-navy);
            font-size: 2rem;
            text-transform: uppercase;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .date-stamp {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            color: var(--cool-grey);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
            display: block;
            margin-bottom: 20px;
        }

        .press-image {
            margin: 25px 0;
            border: 1px solid #eee;
            background: #fdfdfd;
        }

        .press-image img {
            display: block;
            width: 100%;
            height: auto;
        }

        .image-credit {
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            color: #777;
            padding: 10px;
            border-top: 1px solid #eee;
        }

        .read-link {
            display: inline-block;
            margin-top: 10px;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            color: var(--primary-navy);
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 1px;
            transition: opacity 0.2s;
        }

        .read-link:hover {
            opacity: 0.7;
        }

        hr {
            border: 0;
            height: 1px;
            background: linear-gradient(to right, var(--cool-grey), transparent);
            margin-top: 40px;
        }

        footer {
            text-align: center;
            padding: 60px;
            color: var(--cool-grey);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<header>
    <h1>Company Press Releases</h1>
    <div id="header-date" class="current-date"></div>
</header>

<div class="container" id="pressContainer">
    </div>

<footer>
    &copy; 2026 Intrepid Flights
</footer>

<script>
    // Set Header Date
    const today = new Date();
    const dateOptions = { month: 'long', day: 'numeric', year: 'numeric' };
    document.getElementById('header-date').innerText = today.toLocaleDateString('en-US', dateOptions);

    // Fetch from press/press.json (Moving up one folder from /company/)
    fetch('/press/press.json')
      .then(response => {
          if (!response.ok) throw new Error("Could not find press.json");
          return response.json();
      })
      .then(data => {
        // Sort descending while stripping " AD" for the date parser
        data.sort((a, b) => {
            const dateA = new Date(a.date.replace(" AD", ""));
            const dateB = new Date(b.date.replace(" AD", ""));
            return dateB - dateA;
        });

        const container = document.getElementById('pressContainer');

        data.forEach(item => {
          const article = document.createElement('div');
          article.classList.add("press-item");

          let imageBlock = "";
          if (item.image) {
            imageBlock = `
              <div class="press-image">
                <img src="${item.image}" alt="${item.title}">
                ${item.imageCredit ? `<div class="image-credit">${item.imageCredit}</div>` : ""}
              </div>
            `;
          }

          article.innerHTML = `
            <h2>${item.title}</h2>
            <span class="date-stamp">${item.date}</span>
            ${imageBlock}
            <a href="${item.url}" target="_blank" class="read-link">Read Full Release &rarr;</a>
            <hr>
          `;

          container.appendChild(article);
        });
    })
    .catch(err => {
        console.error(err);
        document.getElementById('pressContainer').innerHTML = "<p style='color:red;'>Unable to load press releases. Please verify the path to press.json.</p>";
    });
</script>

</body>
</html>
