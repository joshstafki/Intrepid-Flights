<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsroom | Intrepid Flights</title>
    <link rel="icon" type="image/png" href="https://intrepidflights.com/assets/indigo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://intrepidflights.com/assets/apple-touch-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #002F6C;
            --light-grey: #F8F9FA;
            --medium-grey: #E5E7EB;
            --text-grey: #4B5563;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--light-grey);
            color: var(--navy);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 30px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-family: 'Oswald', sans-serif;
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            color: var(--navy);
        }

        .return-home {
            font-family: 'Oswald', sans-serif;
            font-size: 0.85rem;
            text-decoration: none;
            color: var(--text-grey);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid transparent;
            transition: border-color 0.3s;
        }

        .return-home:hover {
            border-color: var(--navy);
            color: var(--navy);
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .hero-container {
            max-width: 600px;
            text-align: center;
            width: 100%;
        }

        .pre-title {
            font-family: 'Oswald', sans-serif;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text-grey);
            margin-bottom: 10px;
            display: block;
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(3rem, 10vw, 4.5rem);
            margin: 0;
            text-transform: uppercase;
            line-height: 1;
        }

        .accent-line {
            width: 60px;
            height: 4px;
            background-color: var(--navy);
            margin: 30px auto;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text-grey);
            max-width: 450px;
            margin: 0 auto;
        }

        /* --- Featured Article Styles --- */
        .featured-card {
            display: block;
            text-decoration: none;
            background-color: var(--white);
            border: 1px solid var(--medium-grey);
            padding: 35px 30px;
            margin-top: 50px;
            text-align: left;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .featured-card:hover {
            transform: translateY(-5px);
            border-color: var(--navy);
            box-shadow: 0 10px 20px rgba(0, 47, 108, 0.08);
        }

        .featured-tag {
            font-family: 'Oswald', sans-serif;
            font-size: 0.8rem;
            color: var(--navy);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: 15px;
            display: block;
        }

        .featured-title {
            font-family: 'Oswald', sans-serif;
            font-size: 1.8rem;
            color: var(--navy);
            margin: 0 0 15px 0;
            line-height: 1.3;
        }

        .featured-desc {
            font-size: 1rem;
            color: var(--text-grey);
            margin: 0;
            max-width: 100%;
        }

        footer {
            padding: 40px;
            text-align: center;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: var(--text-grey);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<header>
    <a href="/" class="brand">Intrepid Flights</a>
    <a href="/" class="return-home">Return to Home</a>
</header>

<main>
    <div class="hero-container">
        <span class="pre-title">Official</span>
        <h1>Newsroom</h1>
        <div class="accent-line"></div>
        <p>
            This index serves as the central hub for all Intrepid Flights press releases and corporate announcements. 
            <br><br>
            Please check back for future updates and media statements.
        </p>

        <div id="news-card-container"></div>

    </div>
</main>

<footer>
    &copy; 2026 Intrepid Flights
</footer>

<script>
    fetch('https://intrepidflights.com/press/news-card.html')
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.text();
        })
        .then(html => {
            document.getElementById('news-card-container').innerHTML = html;
        })
        .catch(error => {
            console.error('Error loading the news card:', error);
            document.getElementById('news-card-container').innerHTML = '<p style="margin-top: 50px;"><em>Latest news is currently unavailable. Please check back later.</em></p>';
        });
</script>
</body>
</html>
