<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Off Course | Intrepid Flights</title>
    <link rel="icon" type="image/png" href="https://intrepidflights.com/assets/indigo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://intrepidflights.com/assets/apple-touch-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Oswald:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            color: #a7a8aa; /* Brand Grey for general text */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .content { max-width: 600px; padding: 20px; }
        
        /* Brand Navy for Headers */
        h1 { 
            font-family: 'Oswald', sans-serif; 
            font-size: 8rem; 
            margin: 0; 
            color: #002F6C; 
            line-height: 1;
        }
        h2 { 
            font-family: 'Oswald', sans-serif; 
            font-size: 2.5rem; 
            text-transform: uppercase; 
            margin-top: 0; 
            color: #002F6C; 
            letter-spacing: 2px;
        }
        
        /* Brand Grey for Paragraph */
        p { 
            font-size: 1.1rem; 
            line-height: 1.6; 
            color: #a7a8aa; 
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 35px;
            background-color: #002F6C; /* Navy Button */
            color: #a7a8aa; /* Grey Button Text */
            text-decoration: none;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1.5px;
            border-radius: 2px;
            transition: 0.3s ease;
        }
        
        .btn:hover { 
            background-color: #a7a8aa; 
            color: #002F6C; 
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>404</h1>
        <h2>Signal Lost</h2>
        <p>It looks like your flight path led to a non-existent coordinate. The page you are looking for has either moved or never cleared for takeoff.</p>
        <a href="https://www.intrepidflights.com" class="btn">Return to Base</a>
    </div>
</body>
</html>
