<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Intrepid Flights | Mark II</title>

    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Cinematic Aerial Photography. Mobile Experience.">
    <meta name="robots" content="noindex, nofollow">

    <style>
        /* --- 1. NEXT-GEN VARIABLES & RESET --- */
        :root {
            --bg-deep: #000000;
            --glass-panel: rgba(20, 20, 20, 0.7);
            --neon-blue: #00f0ff;
            --neon-purple: #bd00ff;
            --text-main: #ffffff;
            --text-mute: #888888;

            --nav-height: 84px;
            --safe-bottom: env(safe-area-inset-bottom, 20px);
            --ease-elastic: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* --- P3 WIDE COLOR GAMUT (CORRECTED) --- */
        @media (color-gamut: p3) {
            :root {
                --neon-blue: color(display-p3 0 1 1);
                --neon-purple: color(display-p3 0.8 0 1);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: auto; /* FIXED: allow iOS scrolling */
        }

        /* --- 2. DESKTOP LOCKOUT (QR GENERATOR) --- */
        #desktop-lockout {
            display: none;
            position: fixed;
            inset: 0;
            background: #050505;
            z-index: 10000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: monospace;
        }

        .qr-frame {
            padding: 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.2);
            margin-bottom: 30px;
        }

        @media (min-width: 769px) {
            #desktop-lockout { display: flex; }
            #app-root { display: none; }
        }

        /* --- 3. APP SHELL --- */
        #app-root {
            height: 100%;
            width: 100%;
            overflow-y: scroll;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            scroll-snap-type: y mandatory;
            padding-bottom: calc(var(--nav-height) + var(--safe-bottom));
        }

        section {
            min-height: 100vh;
            width: 100%;
            position: relative;
            scroll-snap-align: start;
            padding: 20px 20px 120px;
            display: flex;
            flex-direction: column;
        }

        /* --- 4. HERO --- */
        #hero {
            justify-content: flex-end;
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000000 100%);
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            height: 120%;
            object-fit: cover;
            opacity: 0.6;
            z-index: 0;
            animation: parallax-bg linear both;
            animation-timeline: view();
            animation-range: entry 0% exit 100%;
        }

        @keyframes parallax-bg {
            from { transform: translateY(0); }
            to { transform: translateY(-20%); }
        }

        .hero-content {
            position: relative;
            z-index: 2;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 4rem;
            line-height: 0.9;
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(to bottom right, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            animation: slideUp 0.8s var(--ease-elastic) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        .tagline {
            font-size: 1.1rem;
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            animation: slideUp 0.8s var(--ease-elastic) 0.2s forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 5. PORTFOLIO --- */
        #portfolio {
            background: var(--bg-deep);
            padding-top: 60px;
            display: none;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .card {
            height: 300px;
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            background: #111;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.8);
            animation: card-reveal ease-out both;
            animation-timeline: view();
            animation-range: entry 10% cover 30%;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes card-reveal {
            from { opacity: 0; transform: scale(0.9) translateY(50px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* --- 6. NAV --- */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            height: 70px;
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(20px) saturate(180%);
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            z-index: 100;
        }

        .nav-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }

        .nav-btn.active {
            color: var(--neon-blue);
            background: rgba(0, 240, 255, 0.1);
        }

        .fab-main {
            background: var(--neon-blue);
            color: #000;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-top: -30px;
        }
    </style>
</head>

<body>

<div id="desktop-lockout">
    <div class="qr-frame">
        <img id="qr-code-img" alt="Scan to Enter" width="200" height="200">
    </div>
    <h2>MOBILE ACCESS REQUIRED</h2>
    <p style="color:#666;margin-top:10px;">Scan to transmit session to device.</p>
</div>

<div id="app-root">

    <section id="hero">
        <img src="https://images.unsplash.com/photo-1542296332-2e44a996aa0a?q=80&w=2070" class="hero-bg" alt="">
        <div class="hero-content">
            <div class="tagline">MARK II // SYSTEM READY</div>
            <h1>INTREPID<br>FLIGHTS</h1>
            <p style="color:#ccc;max-width:80%;">Advanced aerial cinematography for the modern age.</p>
        </div>
    </section>

    <section id="portfolio">
        <h2 style="font-size:2rem;margin-bottom:20px;">Mission Logs</h2>
        <div class="gallery-grid">
            <div class="card"><img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?q=80&w=800"></div>
            <div class="card"><img src="https://images.unsplash.com/photo-1559827291-72ee739d0d9a?q=80&w=800"></div>
        </div>
    </section>

</div>

<nav class="bottom-nav">
    <button class="nav-btn active" onclick="switchView('hero', this)">⌂</button>
    <button class="nav-btn fab-main" onclick="haptic(20)">★</button>
    <button class="nav-btn" onclick="switchView('portfolio', this)">▦</button>
</nav>

<script>
    document.getElementById('qr-code-img').src =
      `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(location.href)}`;

    function haptic(ms=10){ navigator.vibrate?.(ms); }

    function switchView(viewId, btn){
        document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
        btn?.classList.add('active');
        hero.style.display = viewId === 'hero' ? 'flex' : 'none';
        portfolio.style.display = viewId === 'portfolio' ? 'block' : 'none';
        scrollTo(0,0);
    }
</script>

</body>
</html>
