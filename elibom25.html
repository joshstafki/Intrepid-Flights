<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Intrepid Flights | Mark II</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Cinematic Aerial Photography. Mobile Experience.">
    <meta name="robots" content="noindex, nofollow">

    <script>
  (function () {
    const isMobile =
      /Android|iPhone|iPod|Opera Mini|IEMobile/i.test(navigator.userAgent);

    if (!isMobile) {
      document.body.innerHTML = `
        <div style="
          font-family: system-ui;
          padding: 2rem;
          text-align: center;
        ">
          This experience is available on mobile devices only.
        </div>
      `;
    }
  })();
</script>


    <style>
        /* --- 1. NEXT-GEN VARIABLES & RESET --- */
        :root {
            /* Fallback colors */
            --bg-deep: #000000;
            --glass-panel: rgba(20, 20, 20, 0.7);
            --neon-blue: #00f0ff;
            --neon-purple: #bd00ff;
            --text-main: #ffffff;
            --text-mute: #888888;
            
            /* P3 Wide Color Gamut (Overwrites on supported devices) */
            @media (color-gamut: p3) {
                --neon-blue: color(display-p3 0 1 1);
                --neon-purple: color(display-p3 0.8 0 1);
            }

            --nav-height: 84px;
            --safe-bottom: env(safe-area-inset-bottom, 20px);
            --ease-elastic: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; /* App-like container */
            height: 100vh;
            width: 100vw;
        }

        /* --- 2. DESKTOP LOCKOUT (QR GENERATOR) --- */
        #desktop-lockout {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #050505;
            z-index: 10000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: monospace;
        }

        .qr-frame {
            padding: 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.2);
            margin-bottom: 30px;
        }

        @media (min-width: 769px) {
            #desktop-lockout { display: flex; }
            #app-root { display: none; }
        }

        /* --- 3. APP SHELL & VIEW TRANSITIONS --- */
        #app-root {
            height: 100%;
            width: 100%;
            overflow-y: scroll;
            scroll-behavior: smooth;
            /* Scroll Snap for sections */
            scroll-snap-type: y mandatory;
            padding-bottom: calc(var(--nav-height) + var(--safe-bottom));
        }

        /* Named View Transitions for smooth morphing */
        ::view-transition-old(root),
        ::view-transition-new(root) {
            animation-duration: 0.4s;
        }

        /* Sections */
        section {
            min-height: 100vh;
            width: 100%;
            position: relative;
            scroll-snap-align: start;
            padding: 20px;
            display: flex;
            flex-direction: column;
            /* Prevent content overlap with nav */
            padding-bottom: 120px; 
        }

        /* --- 4. HERO SECTION (SCROLL-DRIVEN PARALLAX) --- */
        #hero {
            justify-content: flex-end;
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000000 100%);
            overflow: hidden;
            view-transition-name: hero-section;
        }

        /* The Background Image */
        .hero-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 120%;
            object-fit: cover;
            opacity: 0.6;
            z-index: 0;
            
            /* Modern Scroll-Driven Animation */
            /* As we scroll down (view block), translate Y */
            animation: parallax-bg linear both;
            animation-timeline: view();
            animation-range: entry 0% exit 100%;
        }

        @keyframes parallax-bg {
            from { transform: translateY(0); }
            to { transform: translateY(-20%); }
        }

        .hero-content {
            position: relative;
            z-index: 2;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 4rem;
            line-height: 0.9;
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(to bottom right, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            
            /* Animate IN on load */
            animation: slideUp 0.8s var(--ease-elastic) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        .tagline {
            font-size: 1.1rem;
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            animation: slideUp 0.8s var(--ease-elastic) 0.2s forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 5. GRID & SCROLL ANIMATIONS --- */
        #portfolio {
            background: var(--bg-deep);
            padding-top: 60px;
            display: none; /* Hidden by default, toggled via JS/ViewTransition */
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
        }

        .card {
            height: 300px;
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            background: #111;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.8);
            
            /* Scroll-Driven Reveal */
            animation: card-reveal ease-out both;
            animation-timeline: view();
            animation-range: entry 10% cover 30%;
        }

        .card img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:active img { transform: scale(1.05); }

        .card-meta {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 20px;
        }

        @keyframes card-reveal {
            from { opacity: 0; transform: scale(0.9) translateY(50px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* --- 6. HAPTIC ACTION BAR --- */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            height: 70px;
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            z-index: 100;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
        }

        .nav-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            transition: all 0.3s ease;
            position: relative;
            width: 50px; height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn.active {
            color: var(--neon-blue);
            background: rgba(0, 240, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }

        .nav-btn svg { width: 24px; height: 24px; stroke-width: 2.5; }

        /* The "Call" Button (Floating Action) */
        .fab-main {
            background: var(--neon-blue);
            color: #000;
            width: 60px; height: 60px;
            border-radius: 50%;
            margin-top: -30px; /* Float above */
            box-shadow: 0 0 30px var(--neon-blue);
            display: flex; align-items: center; justify-content: center;
            animation: pulse-glow 3s infinite;
        }
        
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px var(--neon-blue); }
            50% { box-shadow: 0 0 40px var(--neon-blue); }
        }

    </style>
</head>
<body>

    <div id="desktop-lockout">
        <div class="qr-frame">
            <img id="qr-code-img" src="" alt="Scan to Enter" width="200" height="200">
        </div>
        <h2>MOBILE ACCESS REQUIRED</h2>
        <p style="color: #666; margin-top: 10px;">Scan to transmit session to device.</p>
    </div>

    <div id="app-root">
        
        <section id="hero">
            <img src="https://images.unsplash.com/photo-1542296332-2e44a996aa0a?q=80&w=2070&auto=format&fit=crop" class="hero-bg" alt="Aerial Texture">
            <div class="hero-content">
                <div class="tagline">MARK II // SYSTEM READY</div>
                <h1>INTREPID<br>FLIGHTS</h1>
                <p style="color: #ccc; max-width: 80%;">Advanced aerial cinematography for the modern age.</p>
            </div>
        </section>

        <section id="portfolio">
            <h2 style="font-size: 2rem; margin-bottom: 20px;">Mission Logs</h2>
            <div class="gallery-grid">
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?q=80&w=800" loading="lazy">
                    <div class="card-meta"><h4>Sector 7</h4></div>
                </div>
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1559827291-72ee739d0d9a?q=80&w=800" loading="lazy">
                    <div class="card-meta"><h4>Night Ops</h4></div>
                </div>
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?q=80&w=800" loading="lazy">
                    <div class="card-meta"><h4>High Altitude</h4></div>
                </div>
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1506157786151-b8491531f063?q=80&w=800" loading="lazy">
                    <div class="card-meta"><h4>Velocity</h4></div>
                </div>
            </div>
        </section>
        
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="switchView('hero', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        </button>
        
        <button class="nav-btn fab-main" onclick="haptic(20)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
        </button>
        
        <button class="nav-btn" onclick="switchView('portfolio', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        </button>
    </nav>

    <script>
        // --- 1. QR GENERATION FOR LOCKOUT ---
        // Generates a QR code for the current URL so desktop users can scan to mobile
        const currentUrl = window.location.href;
        document.getElementById('qr-code-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(currentUrl)}&bgcolor=ffffff&color=000000`;

        // --- 2. HAPTIC ENGINE ---
        function haptic(ms = 10) {
            if (navigator.vibrate) navigator.vibrate(ms);
        }

        // --- 3. VIEW TRANSITIONS API LOGIC ---
        function switchView(viewId, btn) {
            haptic(15);
            
            // Check if browser supports View Transitions
            if (!document.startViewTransition) {
                // Fallback for older browsers: Just swap instantly
                performDOMUpdate(viewId, btn);
                return;
            }

            // Start the transition
            document.startViewTransition(() => {
                performDOMUpdate(viewId, btn);
            });
        }

        function performDOMUpdate(viewId, btn) {
            // Update Navigation State
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');

            // Toggle Sections
            // We use display none/flex to simulate page swaps
            if (viewId === 'hero') {
                document.getElementById('hero').style.display = 'flex';
                document.getElementById('portfolio').style.display = 'none';
            } else {
                document.getElementById('hero').style.display = 'none';
                document.getElementById('portfolio').style.display = 'block';
                window.scrollTo(0,0); // Reset scroll for new 'page'
            }
        }
        
        // --- 4. ADVANCED INTENT DETECTION ---
        // If user tilts phone (gyro), we can add subtle effects (optional advanced feature)
        window.addEventListener("deviceorientation", (e) => {
            const tiltX = e.gamma * 0.2; // Left/Right
            const tiltY = e.beta * 0.2;  // Front/Back
            
            const heroBg = document.querySelector('.hero-bg');
            if(heroBg) {
                // Apply subtle parallax based on hand movement
                heroBg.style.transform = `translate(${tiltX}px, ${tiltY}px) scale(1.1)`;
            }
        }, true);

    </script>
</body>
</html>
